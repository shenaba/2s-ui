<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Subscription</title>
  <style>
    :root { color-scheme: dark; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #0f1220;
      color: #e6e9f5;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    .card {
      max-width: 420px;
      padding: 40px 32px;
      border-radius: 18px;
      background: #171b2e;
      border: 1px solid #262b45;
      text-align: center;
    }
    h1 { margin: 0 0 10px; font-size: 20px; }
    p { margin: 0; color: #9aa3c0; font-size: 14px; line-height: 1.6; }
    code { background: #0f1220; padding: 2px 6px; border-radius: 6px; color: #7dd3fc; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Subscription Dashboard</h1>
    <p>This is the embedded fallback page. Build the subscriber frontend
    (<code>frontend/subscriber</code>) and it is replaced by the full Vue dashboard.</p>
  </div>
</body>
</html>
