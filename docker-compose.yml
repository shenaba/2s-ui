---
services:
  s-ui:
    image: ghcr.io/shenaba/2s-ui
    container_name: s-ui
    hostname: "s-ui"
    volumes:
      - "./db:/app/db"
      - "./cert:/root/cert"
      # acme.sh account and renewal records; without it a recreated
      # container can no longer renew its certificates.
      - "./acme.sh:/root/.acme.sh"
    tty: true
    restart: unless-stopped
    ports:
      - "2095:2095"
      - "2096:2096"
      # Uncomment the line below to enable automatic ACME (Let's Encrypt)
      # certificates. It binds host port 80, which must be free.
      # - "80:80"
    networks:
      - s-ui
    entrypoint: "./entrypoint.sh"

networks:
  s-ui:
    driver: bridge
