name: CI

# The only gate that runs on a pull request. release.yml and windows.yml do build
# on push to main -- their path filters do cover **.go, go.mod and go.sum -- but
# only once the merge has landed, and by way of the full seven-platform release
# matrix. This runs on the PR instead, in two cheap jobs. (docker.yml has no push
# trigger at all, so a Dockerfile change stays ungated until a release.)
#
# Both jobs run on every PR rather than behind path filters. A Go-only PR pays a
# vite build and an npm-only PR pays a Go build plus tests, which is a few
# minutes each and buys the simpler thing: no filter to drift out of sync, and no
# skipped job to confuse a required status check.
on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: "25"

jobs:
  backend:
    name: build (linux/amd64)
    runs-on: ubuntu-latest
    env:
      # Same tags release.yml uses for its non-naive platforms. The naive tags are
      # left out on purpose: they need the Chromium/cronet toolchain, which costs
      # minutes to fetch and adds nothing to this gate.
      BUILD_TAGS: with_quic,with_grpc,with_utls,with_acme,with_gvisor,badlinkname,tfogo_checklinkname0,with_tailscale
    steps:
      # The frontend is not needed to compile the backend, so this job never
      # builds it: web/html is gitignored, and web.go's `//go:embed *` matches
      # web.go itself, so the embed resolves without a frontend build.
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      # core/protocol/*/inbound.go are verbatim sing-box copies. They keep
      # compiling after a sing-box bump while silently running the old
      # implementation, so vet and build cannot catch staleness -- only this can.
      - name: Check vendored protocol copies
        run: |
          go mod download github.com/sagernet/sing-box
          bash scripts/check-protocol-copies.sh

      - name: Vet
        run: go vet -tags "$BUILD_TAGS" ./...

      # -checklinkname=0 is required, not cosmetic: sing-box's badtls references
      # unexported crypto/tls internals, and the link fails without it with
      # "invalid reference to crypto/tls.(*Conn).handlePostHandshakeMessage".
      - name: Build
        run: go build -ldflags="-w -s -checklinkname=0" -tags "$BUILD_TAGS" -o /dev/null .

      # Test binaries link the same sing-box internals as the panel, so they
      # need the same tags and -checklinkname=0 as the build above. Tests that
      # hit sqlite go through cgo; ubuntu-latest ships gcc, so nothing extra
      # to install.
      - name: Test
        run: go test -tags "$BUILD_TAGS" -ldflags="-checklinkname=0" ./...

  # Lived in the frontend repo's own ci.yml until that repo was inlined here.
  # It has to stay a gate: nothing else builds the frontend before a release, so
  # without it a broken npm bump would surface only when a release is cut, and
  # only then as a failed release build.
  frontend:
    name: build (frontend)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # `build` is `vue-tsc --noEmit && vite build`, so this gates types and bundle.
      - name: Type-check and build
        run: npm run build
